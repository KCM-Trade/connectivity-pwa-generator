<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP安装链接生成器</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <script src="js/bootstrap.bundle.min.js"></script>
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* 背景容器 */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('./images/kcm-trading-element-bg.webp');
      background-size: auto 100%;
      background-position: right bottom;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* 大屏幕时使用 cover 确保背景图足够大并覆盖整个区域 */
    @media (min-width: 1200px) {
      .bg-container {
        background-size: cover;
      }
    }

    /* 主容器 */
    .main-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 卡片样式 */
    .widget-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px 50px;
      max-width: 480px;
      width: 100%;
      position: relative;
      text-align: center;
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #999;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #333;
    }

    /* Logo */
    .logo-container {
      margin-bottom: 30px;
    }

    .logo-container img {
      height: 40px;
      width: auto;
    }

    /* 标题 */
    .widget-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .widget-title img {
      width: 20px;
      height: 20px;
    }

    /* 生成按钮 */
    .generate-btn {
      background: linear-gradient(135deg, #f7c948 0%, #e6b134 100%);
      border: none;
      border-radius: 28px;
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      width: 100%;
      max-width: 280px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 168, 75, 0.3);
    }

    .generate-btn:hover {
      background: linear-gradient(135deg, #e0b85c 0%, #d4a84b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 168, 75, 0.4);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast 通知 */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }

    /* Modal 样式覆盖 */
    .modal-backdrop {
      z-index: 1040 !important;
    }

    .modal {
      z-index: 1050 !important;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      border-bottom: 1px solid #f0f0f0;
      padding: 20px 24px;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px;
    }

    /* URL 列表样式 */
    .url-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .url-text {
      flex: 1;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      text-align: left;
    }

    .copy-btn {
      background: #1a2036;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: linear-gradient(135deg, #e0b85c 0%, #d4a84b 100%);
      color: #1a1a2e;
    }

    /* Token 信息框样式 */
    .modal-body .alert-success {
      word-break: break-all;
      font-size: 13px;
    }

    /* 警告样式 */
    .warning-box {
      background: #fff8e6;
      border: 1px solid #ffe0a0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #8a6d3b;
      text-align: left;
    }

    .warning-box i {
      color: #d4a84b;
      margin-right: 8px;
    }

    /* 响应式调整 */
    @media (max-width: 576px) {
      .widget-card {
        padding: 30px 24px;
        border-radius: 12px;
        margin: 10px;
      }

      .logo-container img {
        height: 32px;
      }

      .widget-title {
        font-size: 16px;
      }

      .generate-btn {
        font-size: 15px;
        padding: 12px 30px;
      }

      .close-btn {
        top: 12px;
        right: 12px;
      }
    }

    @media (max-width: 400px) {
      .widget-card {
        padding: 24px 20px;
      }

      .generate-btn {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- 背景 -->
  <div class="bg-container"></div>

  <!-- 主容器 -->
  <div class="main-container">
    <div class="widget-card">
      <!-- 关闭按钮 -->
      <button class="close-btn" onclick="window.close()" title="關閉">&times;</button>
      
      <!-- Logo -->
      <div class="logo-container">
        <img src="./images/KCMTrade.svg" alt="KCM Trade">
      </div>

      <!-- 标题 -->
      <h1 class="widget-title">
        <img src="./images/link.svg" alt="link">
        APP 安装链接生成器
      </h1>

      <!-- 生成按钮 -->
      <button id="generate-token-btn" class="generate-btn">
        生成APP安装链接
      </button>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="copy-toast" class="toast-container" style="display:none;">
    <div class="toast align-items-center text-bg-success border-0 show" role="alert">
      <div class="d-flex">
        <div class="toast-body">已複製到剪貼簿</div>
      </div>
    </div>
  </div>

  <script>
    // Token generation function
    document.getElementById('generate-token-btn').onclick = function() {
      const btn = this;
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = '生成中...';
      
      fetch('/api/generateToken', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showTokenModal(data.token, data.id, data.pwaUrls);
        } else {
          alert('Token 生成失敗：' + (data.error || '未知錯誤'));
        }
      })
      .catch(err => {
        alert('Token 生成失敗：' + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = originalText;
      });
    };

    // Show token modal with PWA URLs
    function showTokenModal(token, id, pwaUrls) {
      let urlsHtml = '';
      if (pwaUrls && pwaUrls.length > 0) {
        urlsHtml = '<h6 class="mb-3" style="font-weight: 600; color: #1a1a2e;">PWA 链接：</h6>';
        pwaUrls.forEach(pwaUrl => {
          const fullUrl = pwaUrl.url + '?token=' + token;
          urlsHtml += `
            <div class="url-item">
              <span class="url-text">${fullUrl}</span>
              <button class="copy-btn" onclick="copyToClipboard('${fullUrl}')">
                <i class="bi bi-files"></i> 複製
              </button>
            </div>
          `;
        });
      } else {
        urlsHtml = '<p class="text-muted">沒有找到 PWA URLs</p>';
      }

      const modalHtml = `
        <div class="modal fade" id="tokenModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" style="font-weight: 600;">
                  <i class="bi bi-check-circle-fill text-success me-2"></i>
                  生成成功
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <div class="alert alert-success">
                  <strong>Token:</strong> ${token}<br>
                  <strong>資料庫 ID:</strong> ${id}
                </div>
                <div class="warning-box">
                  <i class="bi bi-exclamation-triangle-fill"></i>
                  <strong>请注意：</strong>此链接为一次性使用，请使用邮箱进行推送，不要透过微信或QQ传送，以免导致被封锁而无法打开。
                </div>
                ${urlsHtml}
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // Remove existing modal if any
      const existingModal = document.getElementById('tokenModal');
      if (existingModal) {
        existingModal.remove();
      }

      // Add new modal to body
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      
      // Show modal
      const tokenModal = new bootstrap.Modal(document.getElementById('tokenModal'));
      tokenModal.show();

      // Remove modal from DOM when hidden
      document.getElementById('tokenModal').addEventListener('hidden.bs.modal', function() {
        this.remove();
      });
    }

    // Copy to clipboard function
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showCopyToast();
      }).catch(err => {
        console.error('Failed to copy: ', err);
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showCopyToast();
      });
    }

    // Show copy toast notification
    function showCopyToast() {
      const toast = document.getElementById('copy-toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
  </script>
</body>
</html>
