<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP安装链接生成器</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <script src="js/bootstrap.bundle.min.js"></script>
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* 背景容器 */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('./images/kcm-trading-element-bg.webp');
      background-size: auto 100%;
      background-position: right bottom;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* 大屏幕时使用 cover 确保背景图足够大并覆盖整个区域 */
    @media (min-width: 1200px) {
      .bg-container {
        background-size: cover;
      }
    }

    /* 主容器 */
    .main-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 卡片样式 */
    .widget-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px 50px;
      max-width: 480px;
      width: 100%;
      position: relative;
      text-align: center;
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #999;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #333;
    }

    /* Logo */
    .logo-container {
      margin-bottom: 30px;
    }

    .logo-container img {
      height: 40px;
      width: auto;
    }

    /* 标题 */
    .widget-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .widget-title img {
      width: 20px;
      height: 20px;
    }

    /* 生成按钮 */
    .generate-btn {
      background: linear-gradient(135deg, #f7c948 0%, #e6b134 100%);
      border: none;
      border-radius: 28px;
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      width: 100%;
      max-width: 280px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 168, 75, 0.3);
    }

    .generate-btn:hover {
      background: linear-gradient(135deg, #e0b85c 0%, #d4a84b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 168, 75, 0.4);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast 通知 */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }

    /* Modal 样式覆盖 */
    .modal-backdrop {
      z-index: 1040 !important;
    }

    .modal {
      z-index: 1050 !important;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      border-bottom: 1px solid #f0f0f0;
      padding: 20px 24px;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px;
    }

    /* URL 列表样式 */
    .url-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .url-text {
      flex: 1;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      text-align: left;
    }

    .copy-btn {
      background: #1a2036;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: linear-gradient(135deg, #e0b85c 0%, #d4a84b 100%);
      color: #1a1a2e;
    }

    /* Token 信息框样式 */
    .modal-body .alert-success {
      word-break: break-all;
      font-size: 13px;
    }

    /* 警告样式 */
    .warning-box {
      background: #fff8e6;
      border: 1px solid #ffe0a0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #8a6d3b;
      text-align: left;
    }

    .warning-box i {
      color: #d4a84b;
      margin-right: 8px;
    }

    /* 响应式调整 */
    @media (max-width: 576px) {
      .widget-card {
        padding: 30px 24px;
        border-radius: 12px;
        margin: 10px;
      }

      .logo-container img {
        height: 32px;
      }

      .widget-title {
        font-size: 16px;
      }

      .generate-btn {
        font-size: 15px;
        padding: 12px 30px;
      }

      .close-btn {
        top: 12px;
        right: 12px;
      }
    }

    @media (max-width: 400px) {
      .widget-card {
        padding: 24px 20px;
      }

      .generate-btn {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- 背景 -->
  <div class="bg-container"></div>

  <!-- 主容器 -->
  <div class="main-container">
    <div class="widget-card">
      
      <!-- Logo -->
      <div class="logo-container">
        <img src="./images/KCMTrade.svg" alt="KCM Trade">
      </div>

      <!-- 标题 -->
      <h1 class="widget-title">
        <img src="./images/link.svg" alt="link">
        APP 安装链接生成器
      </h1>

      <!-- 生成按钮 -->
      <button id="generate-token-btn" class="generate-btn">
        生成APP安装链接
      </button>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="copy-toast" class="toast-container" style="display:none;">
    <div class="toast align-items-center text-bg-success border-0 show" role="alert">
      <div class="d-flex">
        <div class="toast-body">已複製到剪貼簿</div>
      </div>
    </div>
  </div>

  <script>
    // Token generation function
    document.getElementById('generate-token-btn').onclick = function() {
      const btn = this;
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = '生成中...';
      
      fetch('/api/generateToken', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showTokenModal(data.token, data.id, data.pwaUrls);
        } else {
          alert('Token 生成失敗：' + (data.error || '未知錯誤'));
        }
      })
      .catch(err => {
        alert('Token 生成失敗：' + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = originalText;
      });
    };

    // Show token modal with PWA URLs
    function showTokenModal(token, id, pwaUrls) {
      console.log('[Modal] 开始显示 Token Modal');
      console.log('[Modal] Token:', token);
      console.log('[Modal] ID:', id);
      console.log('[Modal] PWA URLs 数量:', pwaUrls ? pwaUrls.length : 0);
      let urlsHtml = '';
      if (pwaUrls && pwaUrls.length > 0) {
        urlsHtml = '<h6 class="mb-3" style="font-weight: 600; color: #1a1a2e;">PWA 链接：</h6>';
        pwaUrls.forEach((pwaUrl, index) => {
          const fullUrl = pwaUrl.url + '?token=' + token;
          // 转义单引号和双引号，以便在 onclick 中安全使用
          const escapedUrl = fullUrl.replace(/'/g, "\\'").replace(/"/g, '&quot;');
          console.log('[Modal] 生成 URL 项:', { index, url: fullUrl, escapedUrl });
          urlsHtml += `
            <div class="url-item">
              <span class="url-text">${fullUrl}</span>
              <button class="copy-btn" onclick="console.log('[Button] 复制按钮被点击'); copyToClipboard('${escapedUrl}')">
                <i class="bi bi-files"></i> 複製
              </button>
            </div>
          `;
        });
      } else {
        urlsHtml = '<p class="text-muted">沒有找到 PWA URLs</p>';
      }

      const modalHtml = `
        <div class="modal fade" id="tokenModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" style="font-weight: 600;">
                  <i class="bi bi-check-circle-fill text-success me-2"></i>
                  生成成功
                </h5>
              </div>
              <div class="modal-body">
                <div class="alert alert-success">
                  <strong>Token:</strong> ${token}<br>
                  <strong>資料庫 ID:</strong> ${id}
                </div>
                <div class="warning-box">
                  <i class="bi bi-exclamation-triangle-fill"></i>
                  <strong>请注意：</strong>此链接为一次性使用，请使用邮箱进行推送，不要透过微信或QQ传送，以免导致被封锁而无法打开。
                </div>
                ${urlsHtml}
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // Remove existing modal if any
      const existingModal = document.getElementById('tokenModal');
      if (existingModal) {
        console.log('[Modal] 移除已存在的 modal');
        existingModal.remove();
      }

      // Add new modal to body
      console.log('[Modal] 添加 modal HTML 到 DOM');
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      
      // Show modal
      const modalElement = document.getElementById('tokenModal');
      if (!modalElement) {
        console.error('[Modal] ❌ 找不到 modal 元素');
        return;
      }
      console.log('[Modal] 创建 Bootstrap Modal 实例');
      const tokenModal = new bootstrap.Modal(modalElement);
      console.log('[Modal] 显示 modal');
      tokenModal.show();

      // Remove modal from DOM when hidden
      modalElement.addEventListener('hidden.bs.modal', function() {
        console.log('[Modal] Modal 已隐藏，从 DOM 移除');
        this.remove();
      });
    }

    // Copy to clipboard function - 恢复简单可靠的实现
    function copyToClipboard(text) {
      console.log('[Copy] 开始复制功能');
      console.log('[Copy] 要复制的文本:', text);
      console.log('[Copy] 是否在 iframe 中:', window.self !== window.top);
      console.log('[Copy] 是否安全上下文:', window.isSecureContext);
      console.log('[Copy] navigator.clipboard 可用:', !!navigator.clipboard);
      console.log('[Copy] navigator.clipboard.writeText 可用:', !!(navigator.clipboard && navigator.clipboard.writeText));
      
      // 尝试使用 Clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        console.log('[Copy] 尝试使用 Clipboard API...');
        navigator.clipboard.writeText(text).then(() => {
          console.log('[Copy] ✅ Clipboard API 复制成功');
          showCopyToast();
        }).catch(err => {
          console.error('[Copy] ❌ Clipboard API 失败:', err);
          console.log('[Copy] 错误详情:', {
            name: err.name,
            message: err.message,
            stack: err.stack
          });
          console.log('[Copy] 尝试使用 execCommand fallback...');
          // Fallback for older browsers or iframe contexts
          execCommandFallback(text);
        });
      } else {
        console.log('[Copy] Clipboard API 不可用，直接使用 execCommand fallback');
        execCommandFallback(text);
      }
    }

    // execCommand fallback 函数
    function execCommandFallback(text) {
      console.log('[Copy] execCommand fallback 开始执行');
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        console.log('[Copy] 创建 textarea 元素');
        
        // 设置样式使其不可见但可访问
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '0';
        textArea.style.width = '2em';
        textArea.style.height = '2em';
        textArea.style.padding = '0';
        textArea.style.border = 'none';
        textArea.style.outline = 'none';
        textArea.style.boxShadow = 'none';
        textArea.style.background = 'transparent';
        textArea.style.opacity = '0';
        textArea.style.zIndex = '-9999';
        
        document.body.appendChild(textArea);
        console.log('[Copy] textarea 已添加到 DOM');
        
        textArea.focus();
        textArea.select();
        console.log('[Copy] textarea 已获得焦点并选中文本');
        
        // 移动设备支持
        if (textArea.setSelectionRange) {
          textArea.setSelectionRange(0, text.length);
          console.log('[Copy] 设置选择范围:', '0-' + text.length);
        }
        
        const successful = document.execCommand('copy');
        console.log('[Copy] execCommand("copy") 执行结果:', successful);
        
        document.body.removeChild(textArea);
        console.log('[Copy] textarea 已从 DOM 移除');
        
        if (successful) {
          console.log('[Copy] ✅ execCommand 复制成功');
          showCopyToast();
        } else {
          console.error('[Copy] ❌ execCommand 返回 false');
          alert('無法自動複製，請手動複製以下內容：\n\n' + text);
        }
      } catch (err) {
        console.error('[Copy] ❌ execCommand 执行异常:', err);
        console.error('[Copy] 异常详情:', {
          name: err.name,
          message: err.message,
          stack: err.stack
        });
        // 确保移除 textarea
        const textAreas = document.querySelectorAll('textarea[style*="opacity: 0"]');
        textAreas.forEach(ta => {
          if (ta.parentNode) {
            ta.parentNode.removeChild(ta);
            console.log('[Copy] 清理残留的 textarea');
          }
        });
        alert('無法自動複製，請手動複製以下內容：\n\n' + text);
      }
    }

    // Show copy toast notification
    function showCopyToast() {
      console.log('[Toast] 显示复制成功提示');
      const toast = document.getElementById('copy-toast');
      if (toast) {
        toast.style.display = 'block';
        console.log('[Toast] Toast 已显示');
        setTimeout(() => { 
          toast.style.display = 'none';
          console.log('[Toast] Toast 已隐藏');
        }, 2000);
      } else {
        console.error('[Toast] ❌ 找不到 toast 元素');
      }
    }
  </script>
</body>
</html>
