<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP安装链接生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <script src="js/bootstrap.bundle.min.js"></script>
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* 背景容器 */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('./images/kcm-trading-element-bg.webp');
      background-size: auto 100%;
      background-position: right bottom;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* Overlay 遮罩层 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    /* 大屏幕时使用 cover 确保背景图足够大并覆盖整个区域 */
    @media (min-width: 1200px) {
      .bg-container {
        background-size: cover;
      }
    }

    /* 主容器 */
    .main-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
    }

    /* 卡片样式 */
    .widget-card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 50px 36px;
      width: 628px;
      max-width: 100%;
      position: relative;
      text-align: center;
    }

    .status-card {
      text-align: left;
      padding: 24px;
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #1E2749;
    }

    .refresh-status-btn {
      border: 1px solid #dcdcdc;
      background: #ffffff;
      border-radius: 999px;
      color: #1E2749;
      font-size: 14px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .refresh-status-btn:hover {
      background: #f4f5f7;
    }

    .refresh-status-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-url {
      font-size: 13px;
      color: #333;
      word-break: break-all;
      min-height: 20px;
    }

    .status-table .status-col-type,
    .status-table .status-col-status,
    .status-table .status-col-action,
    .status-table .status-cell {
      white-space: nowrap;
    }

    .status-table .status-col-type {
      width: 90px;
    }

    .status-table .status-col-status {
      width: 110px;
    }

    .status-table .status-col-action {
      width: 110px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .status-pill--checking {
      color: #6c757d;
      background: #f1f3f5;
    }

    .status-pill--available {
      color: #155724;
      background: #d4edda;
    }

    .status-pill--unavailable {
      color: #842029;
      background: #f8d7da;
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #999;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #333;
    }

    /* Logo */
    .logo-container {
      margin-bottom: 42px;
    }

    .logo-container img {
      width: 220px;
      height: auto;
    }

    /* 标题 */
    .widget-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 600;
      color: #1E2749;
      margin-bottom: 35px;
    }

    .widget-title img {
      width: 28px;
      height: 28px;
    }

    /* 生成按钮 */
    .generate-btn {
      background: #F5C500;
      border: none;
      border-radius: 28px;
      color: #1E2749;
      font-size: 16px;
      font-weight: 400;
      padding: 14px 40px;
      width: 427px;
      max-width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .generate-btn:hover {
      background: #D8AD03;
      font-weight: 500;
    }

    .generate-btn:active {
      background: #D8AD03;
    }

    .generate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast 通知 */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }

    /* Modal 样式覆盖 */
    .modal-backdrop {
      z-index: 1040 !important;
      background-color: rgba(0, 0, 0, 0.5) !important;
    }

    .modal {
      z-index: 1050 !important;
    }

    .modal-content {
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      width: 628px;
      max-width: 100%;
    }

    .modal-header {
      border-bottom: 1px solid #f0f0f0;
      padding: 20px 24px;
    }

    .modal-body {
      padding: 50px 36px;
    }

    .modal-footer {
      border-top: 1px solid #f0f0f0;
      padding: 16px 24px;
    }

    /* URL 列表样式 */
    .url-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .url-text {
      flex: 1;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      text-align: left;
    }

    .copy-btn {
      background: #1a2036;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: linear-gradient(135deg, #e0b85c 0%, #d4a84b 100%);
      color: #1a1a2e;
    }

    /* Token 信息框样式 */
    .modal-body .alert-success {
      word-break: break-all;
      font-size: 13px;
    }

    /* 警告样式 */
    .warning-box {
      background: #fff8e6;
      border: 1px solid #ffe0a0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #8a6d3b;
      text-align: left;
    }

    .warning-box i {
      color: #d4a84b;
      margin-right: 8px;
    }

    /* 响应式调整 */
    @media (max-width: 576px) {
      .widget-card {
        width: 335px;
        padding: 36px;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
        margin: 10px;
      }

      .logo-container {
        margin-bottom: 42px;
      }

      .logo-container img {
        width: 220px;
        height: auto;
      }

      .widget-title {
        font-size: 16px;
        margin-bottom: 35px;
      }

      .widget-title img {
      width: 20px;
      height: 20px;
    }

      .generate-btn {
        font-size: 15px;
        padding: 12px 30px;
        width: 100%;
        max-width: 100%;
      }

      .close-btn {
        top: 12px;
        right: 12px;
      }

      .status-card {
        padding: 16px;
      }

      .status-title {
        font-size: 16px;
      }
    }

    @media (max-width: 400px) {
      .widget-card {
        padding: 24px 20px;
      }

      .generate-btn {
        max-width: 100%;
      }

      .status-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- 背景 -->
  <div class="bg-container"></div>

  <!-- Overlay 遮罩层 -->
  <div class="overlay"></div>

  <!-- 主容器 -->
  <div class="main-container">
    <div class="widget-card">
      
      <!-- Logo -->
      <div class="logo-container">
        <img src="./images/KCMTrade.svg" alt="KCM Trade">
      </div>

      <!-- 标题 -->
      <h1 class="widget-title">
        <img src="./images/link.svg" alt="link">
        APP 安装链接生成器
      </h1>

      <!-- 生成按钮 -->
      <button id="generate-token-btn" class="generate-btn">
        生成APP安装链接
      </button>
    </div>

    <div class="widget-card status-card">
      <div class="status-header">
        <h2 class="status-title">连接状态</h2>
        <button id="refresh-root-btn" class="refresh-status-btn" type="button">
          刷新
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 status-table">
          <thead>
            <tr>
              <th scope="col" class="status-col-type">类型</th>
              <th scope="col">链接</th>
              <th scope="col" class="status-col-status">状态</th>
              <th scope="col" class="status-col-action">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr data-type="web_app">
              <td>会员中心</td>
              <td class="status-url" id="status-url-web_app">-</td>
              <td id="status-text-web_app" class="status-cell">
                <span class="status-pill status-pill--checking">检测中…</span>
              </td>
              <td>
                <button class="copy-btn" type="button" onclick="copyStatusUrl('web_app')">
                  <i class="bi bi-files"></i> 复制
                </button>
              </td>
            </tr>
            <tr data-type="ows">
              <td>官网</td>
              <td class="status-url" id="status-url-ows">-</td>
              <td id="status-text-ows" class="status-cell">
                <span class="status-pill status-pill--checking">检测中…</span>
              </td>
              <td>
                <button class="copy-btn" type="button" onclick="copyStatusUrl('ows')">
                  <i class="bi bi-files"></i> 复制
                </button>
              </td>
            </tr>
            <tr data-type="aof">
              <td>开户表</td>
              <td class="status-url" id="status-url-aof">-</td>
              <td id="status-text-aof" class="status-cell">
                <span class="status-pill status-pill--checking">检测中…</span>
              </td>
              <td>
                <button class="copy-btn" type="button" onclick="copyStatusUrl('aof')">
                  <i class="bi bi-files"></i> 复制
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="copy-toast" class="toast-container" style="display:none;">
    <div class="toast align-items-center text-bg-success border-0 show" role="alert">
      <div class="d-flex">
        <div class="toast-body">已复制到剪贴板</div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const API_HOST = 'https://chc.bbbb.top/';
    const LINK_TYPES = ['aof', 'ows', 'web_app'];
    const currentStatusUrls = {
      aof: '',
      ows: '',
      web_app: ''
    };

    function setStatus(type, variant, text) {
      const cell = document.getElementById(`status-text-${type}`);
      if (!cell) return;
      cell.innerHTML = `<span class="status-pill status-pill--${variant}">${text}</span>`;
    }

    function setStatusUrl(type, urlText) {
      const cell = document.getElementById(`status-url-${type}`);
      if (!cell) return;
      if (!urlText || urlText === '-') {
        cell.textContent = '-';
        return;
      }

      if (urlText === '无法取得根域名') {
        cell.textContent = urlText;
        return;
      }

      const safeUrl = String(urlText).replace(/"/g, '&quot;');
      cell.innerHTML = `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${urlText}</a>`;
    }

    function copyStatusUrl(type) {
      const targetUrl = currentStatusUrls[type];
      if (!targetUrl) {
        return;
      }
      copyToClipboard(targetUrl);
    }

    async function checkTypeAvailability(type) {
      try {
        await load(API_HOST, type);
        setStatus(type, 'available', '可用');
      } catch (error) {
        setStatus(type, 'unavailable', '不可用');
      }
    }

    async function refreshLinkStatus() {
      const refreshButton = document.getElementById('refresh-root-btn');
      if (refreshButton) {
        refreshButton.disabled = true;
      }

      LINK_TYPES.forEach((type) => {
        setStatus(type, 'checking', '检测中…');
        setStatusUrl(type, '-');
        currentStatusUrls[type] = '';
      });

      try {
        const rootDomain = await getRouter(API_HOST);
        LINK_TYPES.forEach((type) => {
          const fullUrl = `${rootDomain}?type=${type}`;
          currentStatusUrls[type] = fullUrl;
          setStatusUrl(type, fullUrl);
        });
      } catch (error) {
        LINK_TYPES.forEach((type) => {
          setStatus(type, 'unavailable', '不可用');
          setStatusUrl(type, '無法取得根域名');
        });
        if (refreshButton) {
          refreshButton.disabled = false;
        }
        return;
      }

      await Promise.all(LINK_TYPES.map((type) => checkTypeAvailability(type)));
      if (refreshButton) {
        refreshButton.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const refreshButton = document.getElementById('refresh-root-btn');
      if (refreshButton) {
        refreshButton.addEventListener('click', refreshLinkStatus);
      }
      refreshLinkStatus();
    });

    // 监听父窗口的复制响应（如果在 iframe 中）
    if (window.self !== window.top) {
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'COPY_SUCCESS') {
          showCopyToast();
        } else if (event.data && event.data.type === 'COPY_FAILED') {
          // 继续尝试本地方法
        }
      });
    }

    // Token generation function
    document.getElementById('generate-token-btn').onclick = function() {
      const btn = this;
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = '生成中...';
      
      fetch('/api/generateToken', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          showTokenModal(data.token, data.id, data.pwaUrls);
        } else {
          alert('Token 生成失败：' + (data.error || '未知错误'));
        }
      })
      .catch(err => {
        alert('Token 生成失败：' + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = originalText;
      });
    };

    // Show token modal with PWA URLs
    function showTokenModal(token, id, pwaUrls) {
      let urlsHtml = '';
      if (pwaUrls && pwaUrls.length > 0) {
        urlsHtml = '<h6 class="mb-3" style="font-weight: 600; color: #1a1a2e;">PWA 链接：</h6>';
        pwaUrls.forEach((pwaUrl, index) => {
          const fullUrl = pwaUrl.url + '?token=' + token;
          // 转义单引号和双引号，以便在 onclick 中安全使用
          const escapedUrl = fullUrl.replace(/'/g, "\\'").replace(/"/g, '&quot;');
          urlsHtml += `
            <div class="url-item">
              <span class="url-text">${fullUrl}</span>
              <button class="copy-btn" onclick="copyToClipboard('${escapedUrl}')">
                <i class="bi bi-files"></i> 复制
              </button>
            </div>
          `;
        });
      } else {
        urlsHtml = '<p class="text-muted">没有找到 PWA URLs</p>';
      }

      const modalHtml = `
        <div class="modal fade" id="tokenModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" style="font-weight: 600;">
                  <i class="bi bi-check-circle-fill text-success me-2"></i>
                  生成成功
                </h5>
              </div>
              <div class="modal-body">
                <div class="alert alert-success">
                  <strong>Token:</strong> ${token}<br>
                  <strong>数据库 ID:</strong> ${id}
                </div>
                <div class="warning-box">
                  <i class="bi bi-exclamation-triangle-fill"></i>
                  <strong>请注意：</strong>每一条链接可以使用三次(每一次点击"继续"视为使用一次)，请使用邮箱进行推送，不要透过微信或QQ传送，以免导致被封锁而无法打开。
                </div>
                ${urlsHtml}
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
              </div>
            </div>
          </div>
        </div>
      `;

      // Remove existing modal if any
      const existingModal = document.getElementById('tokenModal');
      if (existingModal) {
        existingModal.remove();
      }

      // Add new modal to body
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      
      // Show modal
      const modalElement = document.getElementById('tokenModal');
      if (!modalElement) {
        return;
      }
      const tokenModal = new bootstrap.Modal(modalElement);
      tokenModal.show();

      // Remove modal from DOM when hidden
      modalElement.addEventListener('hidden.bs.modal', function() {
        this.remove();
      });
    }

    // Copy to clipboard function - 优化 iframe 支持
    function copyToClipboard(text) {
      const isInIframe = window.self !== window.top;
      
      // 在 iframe 中，Clipboard API 通常被权限策略阻止，直接使用 execCommand
      if (isInIframe) {
        execCommandFallback(text);
        return;
      }
      
      // 非 iframe 环境：优先尝试 Clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyToast();
        }).catch(err => {
          // Fallback for older browsers or iframe contexts
          execCommandFallback(text);
        });
      } else {
        execCommandFallback(text);
      }
    }

    // execCommand fallback 函数 - 改进版本，在 iframe 中更可靠
    function execCommandFallback(text) {
      const isInIframe = window.self !== window.top;
      
      // 如果在 iframe 中，尝试通过 postMessage 让父窗口复制
      if (isInIframe) {
        try {
          window.parent.postMessage({
            type: 'COPY_TO_CLIPBOARD',
            text: text
          }, '*');
          
          // 等待一小段时间看是否有响应
          setTimeout(() => {
            tryLocalExecCommand(text);
          }, 100);
        } catch (err) {
          tryLocalExecCommand(text);
        }
      } else {
        tryLocalExecCommand(text);
      }
    }

    // 本地 execCommand 尝试
    function tryLocalExecCommand(text) {
      try {
        // 方法1: 使用 contentEditable div（在某些情况下更可靠）
        const div = document.createElement('div');
        div.contentEditable = 'true';
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '1px';
        div.style.height = '1px';
        div.style.opacity = '0';
        div.style.pointerEvents = 'none';
        div.textContent = text;
        document.body.appendChild(div);
        
        const range = document.createRange();
        range.selectNodeContents(div);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        
        const successful1 = document.execCommand('copy');
        
        document.body.removeChild(div);
        selection.removeAllRanges();
        
        if (successful1) {
          showCopyToast();
          return;
        }
      } catch (err) {
        // 继续尝试 textarea 方法
      }
      
      // 方法2: 使用 textarea（传统方法）
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '0';
        textArea.style.width = '2em';
        textArea.style.height = '2em';
        textArea.style.padding = '0';
        textArea.style.border = 'none';
        textArea.style.outline = 'none';
        textArea.style.boxShadow = 'none';
        textArea.style.background = 'transparent';
        textArea.style.opacity = '0';
        textArea.style.zIndex = '-9999';
        
        document.body.appendChild(textArea);
        
        textArea.focus();
        textArea.select();
        
        if (textArea.setSelectionRange) {
          textArea.setSelectionRange(0, text.length);
        }
        
        const successful = document.execCommand('copy');
        
        document.body.removeChild(textArea);
        
        if (successful) {
          showCopyToast();
        } else {
          // 最后的 fallback：显示可选择的文本让用户手动复制
          showManualCopyDialog(text);
        }
      } catch (err) {
        // 清理残留元素
        const textAreas = document.querySelectorAll('textarea[style*="opacity: 0"]');
        textAreas.forEach(ta => {
          if (ta.parentNode) {
            ta.parentNode.removeChild(ta);
          }
        });
        showManualCopyDialog(text);
      }
    }

    // 显示手动复制对话框
    function showManualCopyDialog(text) {
      const dialog = document.createElement('div');
      dialog.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.3);z-index:10000;max-width:90%;max-height:80vh;overflow:auto;';
      dialog.innerHTML = `
        <h3 style="margin-top:0;">无法自动复制</h3>
        <p>请手动复制以下内容：</p>
        <textarea readonly style="width:100%;min-height:100px;padding:10px;border:1px solid #ddd;border-radius:4px;font-family:monospace;font-size:12px;resize:vertical;">${text}</textarea>
        <div style="margin-top:15px;text-align:right;">
          <button onclick="this.closest('div').remove()" style="padding:8px 20px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;">关闭</button>
        </div>
      `;
      document.body.appendChild(dialog);
      
      // 自动选中文本
      const textarea = dialog.querySelector('textarea');
      textarea.focus();
      textarea.select();
    }

    // Show copy toast notification
    function showCopyToast() {
      const toast = document.getElementById('copy-toast');
      if (toast) {
        toast.style.display = 'block';
        setTimeout(() => { 
          toast.style.display = 'none';
        }, 2000);
      }
    }
  </script>
</body>
